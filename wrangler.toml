name = "e8-app"
main = "worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = [ "nodejs_compat" ]
account_id = "dbc98815b0fb7124d9fc27fb40abd290"

[[routes]]
pattern = "e8productions.com/*"
zone_name = "e8productions.com"

[[routes]]
pattern = "www.e8productions.com/*"
zone_name = "e8productions.com"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[triggers]
# * * * * *      — queue tick (upload notifications / NAS sweep drain)
# 0 20 * * 6     — weekly NAS backup sweep populate (Sat 20:00 UTC)
# 0 23 * * *     — daily team summary email + ops Slack (≈ 7:00 PM America/New_York during EDT)
# 0 13 * * *     — auto-invoice (≈ 9:00 AM America/New_York during EDT)
# 15 13 * * *    — enforce portal locks (≈ 9:15 AM ET)
# 0 14 * * *     — billing warning emails (≈ 10:00 AM ET)
# 30 14 * * *    — auto-invoice day-before review reminder (≈ 10:30 AM ET)
# 0 * * * *      — automatic Stripe reconciliation (hourly safety net for the manual "Sync & Refresh")
# 15 * * * *     — Tech Fee failure retry sweep (hourly, offset 15m past billing-sync)
# 0 5 1 * *      — generate-monthly-shoots (auto-create each client's monthly shoot-day quota)
# 5 5 * * *      — Windsor.ai social analytics sync (pulls previous day's data)
# 0 22 * * *     — editor EOD report reminder → e8-editor-updates Slack (6 PM EDT; the 23:00 UTC trigger covers 6 PM EST, route guards to exactly 6 PM ET on weekdays)
# 0 13 / 0 14 * * * — also fire the editor clock-in reminder → e8-editor-updates Slack (9 AM ET weekdays; route guards to exactly 9 AM ET)
# 55 3 * * *     — close open time clocks (≈ 11:55 PM America/New_York during EDT)
crons = [ "* * * * *", "0 20 * * 6", "0 23 * * *", "0 22 * * *", "0 13 * * *", "15 13 * * *", "0 14 * * *", "30 14 * * *", "0 * * * *", "15 * * * *", "0 5 1 * *", "5 5 * * *", "55 3 * * *" ]

[[r2_buckets]]
binding = "R2_VIDEOS"
bucket_name = "e8-app-r2-prod"

[[queues.producers]]
queue = "commission-payouts"
binding = "COMMISSION_QUEUE"

[[queues.producers]]
queue = "scheduler-activity-rollup"
binding = "ROLLUP_QUEUE"

[[queues.producers]]
queue = "notifications"
binding = "NOTIFICATIONS_QUEUE"

[[queues.producers]]
queue = "zip-jobs"
binding = "ZIP_JOBS_QUEUE"

[[queues.consumers]]
queue = "notifications"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "notifications-dlq"

# max_batch_size = 1 is deliberate: each zip job can take hours, so batching
# several jobId messages into one invocation would serialize them behind
# each other for no reason — the container binding underneath can still
# process multiple jobs in parallel across separate invocations (bounded by
# consumer concurrency), it just shouldn't be forced to do so one at a time
# within a single batch. max_retries = 0 because worker.ts's handler always
# acks (see the comment there) — a failed job is surfaced to the user via
# polling instead of being silently retried from scratch.
[[queues.consumers]]
queue = "zip-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 0

# Files & Drive index: R2 event notifications for e8-app-r2-prod land here.
# Create once with:
#   npx wrangler queues create drive-events
#   npx wrangler r2 bucket notification create e8-app-r2-prod --event-type object-create --queue drive-events
#   npx wrangler r2 bucket notification create e8-app-r2-prod --event-type object-delete --queue drive-events
# (No producer binding needed — R2 itself is the producer.)
[[queues.consumers]]
queue = "drive-events"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 5

[[services]]
binding = "FILE_SERVER"
service = "e8-file-server"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true