name = "e8-app"
main = "worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
account_id = "dbc98815b0fb7124d9fc27fb40abd290"

routes = [
  { pattern = "e8productions.com/*", zone_name = "e8productions.com" },
  { pattern = "www.e8productions.com/*", zone_name = "e8productions.com" }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[triggers]
crons = [
  "0 9 * * *",
  "0 0 * * *",
  "* * * * *",
  "0 20 * * 6"
]

[[r2_buckets]]
binding = "R2_VIDEOS"
bucket_name = "e8-app-r2-prod"

[[queues.producers]]
queue = "commission-payouts"
binding = "COMMISSION_QUEUE"

[[queues.producers]]
queue = "scheduler-activity-rollup"
binding = "ROLLUP_QUEUE"

[[services]]
binding = "FILE_SERVER"
service = "e8-file-server"