name = "e8-app"
main = "./custom-worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
account_id = "dbc98815b0fb7124d9fc27fb40abd290"

routes = [
  { pattern = "e8productions.com/*", zone_name = "e8productions.com" },
  { pattern = "www.e8productions.com/*", zone_name = "e8productions.com" }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Billing cron jobs — see custom-worker.ts scheduled() for what each fires.
# cron-master.ts (PM2/node-cron) can't run on Workers, so these replace its
# auto-invoice / portal-lock / commission-payout schedules.
#
# Paused (2026-08-19): auto-invoice, commission-payouts, commission-payouts-reconcile
# are intentionally NOT registered below — logic stays in custom-worker.ts / the
# route handlers, just not scheduled. Re-enable by uncommenting the matching line.
[triggers]
crons = [
  # "0 13 * * *",   # Auto-Invoice Generation — 9:00 AM ET (PAUSED)
  "15 13 * * *",  # Enforce Portal Locks — 9:15 AM ET
  # "0 21 * * 5",   # Commission Payout Batch — Fridays 5:00 PM ET (PAUSED)
  # "0 */2 * * *",  # Commission Payout Reconcile — every 2 hours (PAUSED)
]

[[r2_buckets]]
binding = "R2_VIDEOS"
bucket_name = "e8-app-r2-prod"

[[queues.producers]]
queue = "commission-payouts"
binding = "COMMISSION_QUEUE"

[[queues.producers]]
queue = "scheduler-activity-rollup"
binding = "ROLLUP_QUEUE"

[[services]]
binding = "FILE_SERVER"
service = "e8-file-server"